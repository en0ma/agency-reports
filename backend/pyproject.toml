[project]
name = "agency-reports-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "agency_reports.settings"
testpaths = ["tests"]
addopts = "-q"
